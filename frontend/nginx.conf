# nginx.conf - production web server for the frontend container.
server {
    # Listen on port 80 inside the container (compose maps it to 8080 on your machine).
    listen 80;

    # Folder containing the built React app (index.html + assets).
    root /usr/share/nginx/html;
    # File served for "/".
    index index.html;

    # Allow uploads up to 25 MB (the backend enforces its own limit too).
    client_max_body_size 25m;

    # Every /api/... request is forwarded to the backend container.
    location /api/ {
        # "backend" is the service name from docker-compose.yml (Docker DNS resolves it).
        proxy_pass http://backend:8000;
        # HTTP/1.1 keeps the connection open for streaming.
        proxy_http_version 1.1;
        # Pass the original host name through.
        proxy_set_header Host $host;
        # CRUCIAL for streaming: send each SSE token to the browser immediately
        # instead of collecting the whole response first.
        proxy_buffering off;
        # Long answers can take a while; don't cut the stream after the default 60 s.
        proxy_read_timeout 600s;
    }

    # Everything else: serve the file if it exists, otherwise fall back to index.html
    # (standard setting for single-page applications).
    location / {
        try_files $uri /index.html;
    }
}
