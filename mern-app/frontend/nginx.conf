# nginx.conf - production web server for the frontend container.
server {
    # Listen on port 80 inside the container (compose maps it to 3000 on your machine).
    listen 80;

    # Folder containing the built React app (index.html + assets).
    root /usr/share/nginx/html;
    # File served for "/".
    index index.html;

    # Every /api/... request is forwarded to the backend container.
    location /api/ {
        # "backend" is the service name from docker-compose.yml (Docker DNS resolves it).
        proxy_pass http://backend:4000;
        # Pass the original host name through.
        proxy_set_header Host $host;
    }

    # Everything else: serve the file if it exists, otherwise fall back to index.html
    # (standard setting for single-page applications).
    location / {
        try_files $uri /index.html;
    }
}
